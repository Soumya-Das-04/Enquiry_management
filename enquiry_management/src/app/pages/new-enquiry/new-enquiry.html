<main class="container py-4">
  <section class="card border-0 shadow-sm mx-auto" style="max-width: 900px">
    <div class="card-header bg-warning text-dark border-0 py-3">
      <h1 class="h4 fw-bold mb-0">New Enquiry</h1>
    </div>

    <div class="card-body p-4">
      <form (submit)="onSaveEnquiry($event)">
        <input type="hidden" name="enquiryId" value="0" />

        <div class="row g-3">
          <div class="col-md-6">
            <label for="customerName" class="form-label">Customer Name</label>
            <input
              id="customerName"
              [formField]="enquiryForm.customerName"
              type="text"
              class="form-control"
              autocomplete="name"
              aria-required="true"
            />
          </div>

          <div class="col-md-6">
            <label for="customerEmail" class="form-label">Customer Email</label>
            <input
              id="customerEmail"
              [formField]="enquiryForm.customerEmail"
              type="email"
              class="form-control"
              autocomplete="email"
              aria-required="true"
            />
          </div>

          <div class="col-md-6">
            <label for="customerPhone" class="form-label">Customer Phone</label>
            <input
              id="customerPhone"
              [formField]="enquiryForm.customerPhone"
              type="tel"
              class="form-control"
              autocomplete="tel"
              aria-required="true"
            />
          </div>

          <div class="col-md-6">
            <label for="categoryId" class="form-label">Category ID</label>
            <select
              id="categoryId"
              [formField]="enquiryForm.categoryId"
              class="form-control"
              aria-required="true"
            >
              <option value="">Select Category</option>
              @for (category of categoryList(); track $index) {
                <option [value]="category.categoryId">{{ category.categoryName }}</option>
              }
            </select>
          </div>

          <div class="col-12">
            <label for="message" class="form-label">Message</label>
            <textarea
              id="message"
              [formField]="enquiryForm.message"
              class="form-control"
              rows="3"
              aria-required="true"
            ></textarea>
          </div>

          <div class="col-12">
            <div class="form-check form-switch">
              <input
                id="isConverted"
                name="isConverted"
                type="checkbox"
                class="form-check-input"
                role="switch"
              />
              <label for="isConverted" class="form-check-label">Converted</label>
            </div>
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-success">Create Enquiry</button>
          <button type="reset" class="btn btn-outline-secondary">Reset</button>
        </div>
      </form>
    </div>
  </section>
</main>
