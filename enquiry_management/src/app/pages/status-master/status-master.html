<div class="container-fluid py-4 bg-light min-vh-100">
  <div class="row g-4">
    <div class="col-lg-7">
      <section class="card border-0 shadow-sm h-100">
        <div
          class="card-header bg-warning text-dark border-0 d-flex align-items-center justify-content-between py-3"
        >
          <h1 class="h5 fw-bold mb-0">Status List</h1>
          <span class="badge text-bg-dark">4 statuses</span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col" class="ps-3">#</th>
                  <th scope="col">Status Name</th>
                  <th scope="col">Status</th>
                  <th scope="col" class="text-end pe-3">Actions</th>
                </tr>
              </thead>
              <tbody>
                @for (item of statusList(); track $index) {
                  <tr>
                    <td class="ps-3">{{ $index + 1 }}</td>
                    <td class="fw-semibold">{{ item.statusName }}</td>
                    <td>
                      <span
                        [class]="item.isActive ? 'badge text-bg-success' : 'badge text-bg-danger'"
                      >
                        {{ item.isActive ? 'Active' : 'Inactive' }}
                      </span>
                    </td>
                    <td class="text-end pe-3">
                      <button type="button" class="btn btn-sm btn-outline-primary me-2">
                        Edit
                      </button>
                      <button type="button" class="btn btn-sm btn-outline-danger">Delete</button>
                    </td>
                  </tr>
                }
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <div class="col-lg-5">
      <section class="card border-0 shadow-sm">
        <div class="card-header bg-warning text-dark border-0 py-3">
          <h2 class="h5 fw-bold mb-0">Add / Edit Status</h2>
        </div>
        <div class="card-body p-4">
          <form [formGroup]="statusForm">
            <div class="mb-4">
              <label for="statusName" class="form-label fw-semibold">Status Name</label>
              <input
                id="statusName"
                formControlName="statusName"
                name="statusName"
                type="text"
                class="form-control form-control-lg"
                placeholder="Enter status name"
                required
              />
            </div>

            <div class="mb-4">
              <label for="statusActive" class="form-label fw-semibold d-block">Status</label>
              <div class="form-check form-switch">
                <input
                  id="statusActive"
                  formControlName="isActive"
                  name="isActive"
                  type="checkbox"
                  class="form-check-input"
                  role="switch"
                />
                <label for="statusActive" class="form-check-label">Active</label>
              </div>
              <div class="form-text">Turn on to make this status available.</div>
            </div>

            <div class="d-flex flex-wrap gap-2">
              <button type="button" (click)="onSaveStatus()" class="btn btn-success px-4">
                Save Status
              </button>
              <button type="reset" class="btn btn-outline-secondary px-4">Reset</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </div>
</div>
